{% set name = "pcdsdevices" %}
{% set version = "10.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/pcdsdevices/pcdsdevices-{{ version }}.tar.gz
  sha256: f0fa74c6032e67427918e3a6fa1c949aa277d4d70f123a527610e2afc41e79b4

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools_scm
  run:
    - python >={{ python_min }}
    - bluesky-base >=1.6.4
    - happi
    - jsonschema
    - lightpath-base >=1.0.5
    - matplotlib-base
    - numpy
    - ophyd >=1.7.0
    - pcdscalc >=0.3.3
    - pcdsutils >=0.11.0
    - prettytable
    - pyepics >=3.4.2
    - pytmc >=2.14.0
    - pyyaml
    - schema
    - scipy
    - sympy
  run_constrained:
    - pmgr >=2.0.2
    - typhos >=2.4.0

test:
  imports:
    - pcdsdevices
  requires:
    - python {{ python_min }}

about:
  home: https://github.com/pcdshub/pcdsdevices
  doc_url: https://pcdshub.github.io/pcdsdevices/
  dev_url: https://github.com/pcdshub/pcdsdevices
  license: LicenseRef-BSD-3-Clause-SLAC
  license_family: BSD
  license_file: LICENSE.md
  summary: Collection of Ophyd device subclasses for IOCs unique to the Linac Coherent Light Source (LCLS) at SLAC

extra:
  recipe-maintainers:
    - zllentz
